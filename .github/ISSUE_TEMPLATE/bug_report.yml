name: Bug Report
description: Report a bug or unexpected behavior in CustomFullDexBuild.
title: "[Bug]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve CustomFullDexBuild!"
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open FullDex
        2. Select a game
        3. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows, Steam Deck, Linux, macOS, etc.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant error messages or screenshots.
    validations:
      required: false
